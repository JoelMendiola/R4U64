<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handspace</title>
  </head>
  <body>
    <main class="viewport-wrap">
      <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
      <canvas id="landmarks" aria-hidden="true"></canvas>
      <div id="scene" class="scene"></div>
    </main>
    <section id="start-screen" class="start-screen">
      <button id="camera-toggle" class="camera-toggle start-button" type="button">Activar cámara</button>
    </section>
    <nav class="controls" aria-label="Controles">
      <button id="camera-switch" type="button" disabled>Cambiar a cámara trasera</button>
      <button id="cardboard-toggle" type="button">Entrar en Cardboard</button>
      <button id="reset" type="button">Reiniciar</button>
    </nav>
    <section id="calibration" class="calibration" aria-label="Calibración del modelo">
      <strong>Rotación izquierda</strong>
      <label>X <input id="rotation-left-x" type="range" min="-180" max="180" value="9"><output id="rotation-left-x-value">9°</output></label>
      <label>Y <input id="rotation-left-y" type="range" min="-180" max="180" value="34"><output id="rotation-left-y-value">34°</output></label>
      <label>Z <input id="rotation-left-z" type="range" min="-180" max="180" value="0"><output id="rotation-left-z-value">0°</output></label>
      <code id="rotation-left-coordinates">L X: 9°  Y: 0°  Z: 0°</code>
      <strong>Rotación derecha</strong>
      <label>X <input id="rotation-right-x" type="range" min="-180" max="180" value="-16"><output id="rotation-right-x-value">-16°</output></label>
      <label>Y <input id="rotation-right-y" type="range" min="-180" max="180" value="-16"><output id="rotation-right-y-value">-16°</output></label>
      <label>Z <input id="rotation-right-z" type="range" min="-180" max="180" value="-3"><output id="rotation-right-z-value">-3°</output></label>
      <code id="rotation-right-coordinates">R X: 0°  Y: 0°  Z: 0°</code>
      <label>L <input id="position-left" type="range" min="-2" max="-0.1" step="0.05" value="-1"><output id="position-left-value">-1</output></label>
      <label>R <input id="position-right" type="range" min="0.1" max="2" step="0.05" value="1"><output id="position-right-value">1</output></label>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
